name: Publish verified translation archive
on:
  push:
    branches: [main]
    paths:
      - chapters/**
      - downloads/**
      - validation-report.json
      - scripts/publish-release.py
      - .github/workflows/publish-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: translation-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify chapters and publish the exact committed ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
